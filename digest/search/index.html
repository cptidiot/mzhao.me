<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Search · Daily Digest</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fafaf8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0c0c" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232e3d4a'/%3E%3Ctext x='32' y='44' font-family='Helvetica, Arial, sans-serif' font-size='36' font-weight='500' fill='%23ffffff' text-anchor='middle'%3E%4D%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/assets/sitebar.css">
<script src="/assets/site.js"></script>
<style>
  /* Layout: site bar → back link + title → sticky search field → status line + source chips → results, newest first, grouped by day. */
  .col { max-width: 760px; }
  .back { display: inline-flex; align-items: center; min-height: 44px; margin-top: 12px; font-size: 14px; color: var(--muted); }
  .back:hover { color: var(--ink); }
  h1 { margin: 6px 0 18px; font: 400 clamp(40px, 7vw, 64px)/1 var(--serif); letter-spacing: -.02em; color: var(--ink); }
  h1 em { font-style: italic; }

  .searchbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; margin: 0 -24px; padding: 8px 24px; background: var(--bg); }
  .search { display: flex; align-items: center; gap: 10px; max-width: 760px; min-height: 48px; padding: 0 2px 0 16px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--muted); }
  .search:focus-within { border-color: var(--ink); }
  .search svg { flex: none; }
  .search input { flex: 1; min-width: 0; height: 46px; border: 0; outline: 0; background: transparent; font-size: 16px; color: var(--ink); -webkit-appearance: none; appearance: none; }
  .search input::-webkit-search-cancel-button { display: none; }
  .clear { flex: none; width: 44px; height: 44px; border: 0; border-radius: 50%; background: transparent; font-size: 20px; line-height: 1; color: var(--muted); cursor: pointer; }
  .clear:hover { color: var(--ink); }
  .clear[hidden] { display: none; }

  .status { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; min-height: 44px; margin-top: 6px; font-size: 14px; color: var(--muted); }
  .status strong { color: var(--ink); font-weight: 600; }
  .linkbtn { min-height: 44px; padding: 0; border: 0; background: none; font-size: 14px; color: var(--redtext); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .warn { margin: 4px 0 8px; padding: 10px 14px; border: 1px solid var(--red); border-radius: 8px; font-size: 14px; color: var(--ink); }
  .warn[hidden] { display: none; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
  .chips:empty { display: none; }
  .chip { display: flex; align-items: center; gap: 6px; flex: none; min-height: 44px; padding: 0 13px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); font: 500 14px/1 var(--sans); color: var(--ink); white-space: nowrap; cursor: pointer; }
  .chip span { font-size: 13px; opacity: .7; font-variant-numeric: tabular-nums; }
  .chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }

  .results { list-style: none; margin: 0; padding: 0; }
  .day { display: flex; align-items: baseline; gap: 10px; margin: 26px 0 0; padding-bottom: 8px; border-bottom: 1px solid var(--line); font-size: 13px; font-weight: 600; letter-spacing: .02em; color: var(--ink); }
  .day span { font-weight: 400; color: var(--muted); }
  .res { padding: 16px 0 8px; border-bottom: 1px solid var(--line); }
  .res-meta { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 13px; color: var(--muted); }
  .res-meta .src { font-weight: 600; color: var(--redtext); }
  .res h2 { margin: 4px 0 6px; font: 600 17px/1.4 var(--sans); color: var(--ink); overflow-wrap: anywhere; }
  /* The negative margin keeps the visual spacing while the link gets a 44px-tall tap area. */
  .res h2 a { display: block; margin: -11px 0; padding: 11px 0; }
  .res h2 a:hover { text-decoration: underline; text-underline-offset: 3px; }
  .snip { margin: 0; font-size: 15px; line-height: 1.7; overflow-wrap: anywhere; }
  .res-url { margin: 6px 0 0; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .res-foot { display: flex; gap: 20px; font-size: 14px; }
  .res-foot a { display: inline-flex; align-items: center; min-height: 44px; color: var(--muted); }
  .res-foot a:first-child { color: var(--redtext); font-weight: 500; }
  .res-foot a:hover { color: var(--ink); }
  mark { padding: 0 1px; border-radius: 2px; background: rgba(232, 38, 28, .16); color: inherit; }
  :root[data-theme="dark"] mark { background: rgba(255, 74, 61, .3); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) mark { background: rgba(255, 74, 61, .3); } }

  .empty { padding: 28px 0 12px; font-size: 15px; line-height: 1.8; }
  .empty b { color: var(--ink); font-weight: 600; }
  .more { display: block; width: 100%; min-height: 48px; margin: 20px 0 0; border: 1px solid var(--line); border-radius: 999px; background: var(--card); font-size: 15px; font-weight: 500; color: var(--ink); cursor: pointer; }
  .more:hover { border-color: var(--ink); }
  .more[hidden] { display: none; }
  footer { margin-top: 48px; padding: 16px 0 40px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }

  @media (max-width: 640px) {
    .searchbar { margin: 0 -16px; padding: 8px 16px; }
    .chips { flex-wrap: nowrap; width: calc(100% + 32px); margin: 4px -16px 8px; padding: 0 16px; overflow-x: auto; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .res h2 { font-size: 16px; }
    .snip { font-size: 14.5px; }
  }
</style>
</head>
<body>
<div class="wrap">
  {% include sitebar.html current="digest-issue" toggle_label="切换日间 / 夜间主题" %}
  <main class="col">
    <a class="back" href="/digest/">← Daily Digest</a>
    <h1><em>Search</em> Digest</h1>
    <div class="searchbar">
      <label class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" name="q" aria-label="搜索全部 Digest 历史" placeholder="关键词、作者或来源" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
        <button class="clear" id="clear" type="button" aria-label="清空搜索" hidden>×</button>
      </label>
    </div>
    <div class="status" id="status" role="status" aria-live="polite">正在加载索引…</div>
    <div class="warn" id="warn" hidden></div>
    <div class="chips" id="chips" role="group" aria-label="按来源筛选"></div>
    <ol class="results" id="results"></ol>
    <button class="more" id="more" type="button" hidden></button>
    <button class="more" id="older" type="button" hidden></button>
    <noscript><p class="empty">搜索需要开启 JavaScript。</p></noscript>
  </main>
  <footer>Digest 由定时任务生成 · mzhao.me</footer>
</div>
<script>
(function () {
  var AUTO_MONTHS = 3;   // months loaded without asking; older ones load on request
  var PAGE = 50;         // results shown per step
  var WEEK = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  var $ = function (id) { return document.getElementById(id); };
  var input = $('q');

  var months = [];       // newest first, from months.json
  var next = 0;          // index in `months` of the first month not yet requested
  var failed = [];       // months whose index did not load
  var loading = '';      // the month being fetched right now, or ''
  var items = [];        // every loaded item, newest first
  var state = { q: '', src: '', shown: PAGE };
  var last = { hits: [], counts: {} };

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function norm(s) { s = String(s == null ? '' : s); try { s = s.normalize('NFKC'); } catch (e) {} return s.toLowerCase(); }
  function terms() { return norm(state.q).split(/\s+/).filter(Boolean); }
  function num(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function safeUrl(u) { return /^https?:\/\//i.test(u || '') ? u : '#'; }

  // Wraps every occurrence of a term in <mark>. Works on the raw text, then escapes each piece.
  function hl(text, ts) {
    text = String(text == null ? '' : text);
    var low = text.toLowerCase();
    if (!ts.length || low.length !== text.length) return esc(text);
    var ranges = [];
    ts.forEach(function (t) {
      var i = low.indexOf(t);
      while (i !== -1) { ranges.push([i, i + t.length]); i = low.indexOf(t, i + t.length); }
    });
    if (!ranges.length) return esc(text);
    ranges.sort(function (a, b) { return a[0] - b[0]; });
    var out = '', pos = 0;
    ranges.forEach(function (r) {
      if (r[1] <= pos) return;
      var from = Math.max(r[0], pos);
      out += esc(text.slice(pos, from)) + '<mark>' + esc(text.slice(from, r[1])) + '</mark>';
      pos = r[1];
    });
    return out + esc(text.slice(pos));
  }

  // A window of the text around the first matching term, so the match is visible without reading the whole summary.
  function snippet(text, ts, len) {
    text = String(text == null ? '' : text);
    if (text.length <= len) return text;
    var low = text.toLowerCase(), first = -1;
    ts.forEach(function (t) { var i = low.indexOf(t); if (i !== -1 && (first === -1 || i < first)) first = i; });
    var start = first > len * 0.6 ? Math.max(0, first - 40) : 0;
    var end = Math.min(text.length, start + len);
    return (start > 0 ? '…' : '') + text.slice(start, end) + (end < text.length ? '…' : '');
  }

  function addMonth(rows) {
    var batch = [];
    rows.forEach(function (doc) {
      (doc[4] || []).forEach(function (it) {
        var o = { dt: doc[0], d: String(doc[0]).slice(0, 10), s: doc[1] || '', n: doc[2] || doc[1] || '', u: doc[3] || '',
                  t: it[0] == null ? '' : String(it[0]), x: it[1] == null ? '' : String(it[1]), l: it[2] || '',
                  r: it[3] == null ? '' : String(it[3]), st: it[4] == null ? '' : String(it[4]) };
        o.vis = norm(o.t + '\n' + o.x + '\n' + o.r + '\n' + o.st + '\n' + o.n);
        o.h = o.vis + '\n' + norm(o.l) + '\n' + norm(o.s);
        batch.push(o);
      });
    });
    items = items.concat(batch);
    items.sort(function (a, b) { return a.dt < b.dt ? 1 : a.dt > b.dt ? -1 : 0; });
  }

  // Fetches the given months one after another, newest first, and re-runs the search as each one arrives.
  function loadList(todo) {
    if (loading) return;
    var i = 0;
    (function step() {
      if (i >= todo.length) { loading = ''; search(); return; }
      var m = todo[i++];
      loading = m;
      renderStatus();
      fetch('/digest/search/' + m + '.json')
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (rows) { if (!Array.isArray(rows)) throw new Error('shape'); addMonth(rows); })
        .catch(function () { failed.push(m); })
        .then(function () { search(); step(); });
    })();
  }
  function loadNext(count) {
    if (loading) return;
    var todo = months.slice(next, next + count);
    next += todo.length;
    loadList(todo);
  }

  function search() {
    var ts = terms(), hits = [], counts = {};
    if (ts.length) {
      for (var i = 0; i < items.length; i++) {
        var it = items[i], ok = true;
        for (var j = 0; j < ts.length; j++) { if (it.h.indexOf(ts[j]) === -1) { ok = false; break; } }
        if (ok) { hits.push(it); counts[it.s] = (counts[it.s] || 0) + 1; }
      }
    }
    last = { hits: hits, counts: counts };
    if (state.src && !counts[state.src]) state.src = '';
    render();
  }

  function range() {
    if (!items.length) return '';
    return items[items.length - 1].d + ' 至 ' + items[0].d;
  }

  function renderStatus() {
    var ts = terms(), el = $('status');
    var scope = items.length ? range() + ' · ' + num(items.length) + ' 条' : '';
    var busy = loading ? '正在加载 ' + loading + ' 的索引…' : '';
    if (!ts.length) {
      el.innerHTML = busy ? esc(busy) : (scope ? '可搜范围：' + esc(scope) : '还没有可搜索的内容。');
      return;
    }
    var shown = state.src ? (last.counts[state.src] || 0) : last.hits.length;
    el.innerHTML = '<span>找到 <strong>' + num(shown) + '</strong> 条' + (scope ? ' · 范围 ' + esc(scope) : '') + (busy ? ' · ' + esc(busy) : '') + '</span>';
  }

  function renderChips() {
    var counts = last.counts, ids = Object.keys(counts), names = {};
    if (ids.length < 2) { $('chips').innerHTML = ''; return; }
    last.hits.forEach(function (it) { names[it.s] = it.n; });
    ids.sort(function (a, b) { return counts[b] - counts[a]; });
    var chip = function (id, name, n) {
      return '<button class="chip" type="button" data-src="' + esc(id) + '" aria-pressed="' + (state.src === id) + '">' + esc(name) + '<span>' + num(n) + '</span></button>';
    };
    $('chips').innerHTML = chip('', '全部', last.hits.length) + ids.map(function (id) { return chip(id, names[id], counts[id]); }).join('');
  }

  function dayLabel(d) {
    var p = d.split('-'), wd = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])).getUTCDay();
    return p[0] + '-' + p[1] + '-' + p[2] + ' ' + WEEK[wd];
  }

  function row(it, ts) {
    var link = norm(it.l);
    var urlOnly = ts.some(function (t) { return it.vis.indexOf(t) === -1 && link.indexOf(t) !== -1; });
    var who = [it.r, it.st].filter(Boolean).join(' · ');
    // Only jump into the middle of the summary for terms that are not already visible in the title, author or source.
    var head = norm(it.t + '\n' + who + '\n' + it.n);
    var inSummaryOnly = ts.filter(function (t) { return head.indexOf(t) === -1; });
    var url = safeUrl(it.l);
    var html = '<li class="res"><div class="res-meta"><span class="src">' + hl(it.n, ts) + '</span>' + (who ? '<span>' + hl(who, ts) + '</span>' : '') + '</div>' +
      '<h2><a href="' + esc(url) + '" target="_blank" rel="noopener">' + hl(it.t, ts) + '</a></h2>' +
      '<p class="snip">' + hl(snippet(it.x, inSummaryOnly, 180), ts) + '</p>';
    // A term that only matched the link would otherwise have no visible highlight, so show the link.
    if (urlOnly) html += '<p class="res-url">' + hl(snippet(it.l.replace(/^https?:\/\/(www\.)?/i, ''), ts, 90), ts) + '</p>';
    html += '<div class="res-foot"><a href="' + esc(url) + '" target="_blank" rel="noopener">原文 ↗</a>' + (it.u ? '<a href="' + esc(it.u) + '">整期 →</a>' : '') + '</div></li>';
    return html;
  }

  function render() {
    var ts = terms();
    $('clear').hidden = !state.q;
    renderStatus();
    renderChips();

    $('warn').hidden = !failed.length;
    if (failed.length) $('warn').innerHTML = esc(failed.join('、')) + ' 的索引没有加载成功，结果不含这部分。<button class="linkbtn" type="button" id="retry">重试</button>';

    var list = state.src ? last.hits.filter(function (it) { return it.s === state.src; }) : last.hits;
    var html = '', day = '';
    if (ts.length) {
      var perDay = {};
      list.forEach(function (it) { perDay[it.d] = (perDay[it.d] || 0) + 1; });
      list.slice(0, state.shown).forEach(function (it) {
        if (it.d !== day) { day = it.d; html += '<li class="day">' + dayLabel(day) + '<span>' + perDay[day] + ' 条</span></li>'; }
        html += row(it, ts);
      });
      if (!list.length && !loading) {
        html = '<li class="empty">没有找到 <b>“' + esc(state.q.trim()) + '”</b>。' +
          (ts.length > 1 ? '<br>多个词之间是“同时包含”，可以减少关键词再试。' : '<br>换一个词，或只写关键词的一部分。') + '</li>';
      }
    } else if (!loading) {
      html = '<li class="empty">搜索范围是<b>全部来源</b>的历史内容，匹配标题、摘要、作者、来源名和链接。<br>多个词用空格分开，表示同时包含。例如 <b>swyx agent</b>。</li>';
    }
    $('results').innerHTML = html;

    var rest = ts.length ? list.length - state.shown : 0;
    $('more').hidden = rest <= 0;
    if (rest > 0) $('more').textContent = '再显示 ' + Math.min(PAGE, rest) + ' 条（还有 ' + num(rest) + ' 条）';

    var olderLeft = months.length - next;
    $('older').hidden = loading || olderLeft <= 0;
    if (olderLeft > 0) $('older').textContent = '继续搜索更早的内容（还有 ' + olderLeft + ' 个月没搜）';
  }

  var urlTimer;
  function syncUrl() {
    clearTimeout(urlTimer);
    urlTimer = setTimeout(function () {
      var p = new URLSearchParams();
      if (state.q.trim()) p.set('q', state.q.trim());
      if (state.src) p.set('s', state.src);
      var qs = p.toString();
      try { history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '')); } catch (e) {}
    }, 300);
  }

  var runTimer;
  input.addEventListener('input', function () {
    state.q = input.value; state.shown = PAGE;
    clearTimeout(runTimer);
    runTimer = setTimeout(function () { search(); syncUrl(); }, 120);
  });
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') input.blur(); });
  $('clear').addEventListener('click', function () { input.value = ''; state.q = ''; state.src = ''; state.shown = PAGE; search(); syncUrl(); input.focus(); });
  $('chips').addEventListener('click', function (e) {
    var b = e.target.closest('.chip'); if (!b) return;
    state.src = b.getAttribute('data-src'); state.shown = PAGE; render(); syncUrl();
  });
  $('more').addEventListener('click', function () { state.shown += PAGE; render(); });
  $('older').addEventListener('click', function () { loadNext(AUTO_MONTHS); });
  $('warn').addEventListener('click', function (e) {
    if (e.target.id !== 'retry' || loading) return;
    var again = failed; failed = [];
    loadList(again);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== input) { e.preventDefault(); input.focus(); }
  });

  var params = new URLSearchParams(location.search);
  state.q = params.get('q') || '';
  state.src = params.get('s') || '';
  input.value = state.q;
  if (!state.q && window.matchMedia && matchMedia('(hover: hover)').matches) input.focus();

  fetch('/digest/search/months.json')
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (j) { months = (j && j.months) || []; loadNext(AUTO_MONTHS); })
    .catch(function () {
      $('status').textContent = '';
      $('warn').hidden = false;
      $('warn').textContent = '搜索索引没有加载成功。请刷新页面重试。';
    });
})();
</script>
