title: Marshall Zhao
timezone: America/Los_Angeles
remote_theme: broccolini/swiss
theme_color: white
plugins:
  - jekyll-remote-theme
collections:
  thoughts:
    output: false
  digests:
    output: true
    permalink: /digest/:name/
defaults:
  - scope:
      path: ""
      type: "digests"
    values:
      layout: "digest"
