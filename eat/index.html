: "manual"}, {"n": "The Public Izakaya", "c": "asian", "r": "san_francisco", "a": "San Francisco", "d": "差评：难吃", "u": "https://www.google.com/maps/search/?api=1&query=The%20Public%20Izakaya%20San%20Francisco", "s": "manual"}, {"n": "Taste", "c": "chinese", "r": "peninsula", "a": "Palo Alto", "d": "水煮牛肉牛肉嫩（美式中餐 · Palo Alto）", "u": "https://www.google.com/maps/search/?api=1&query=Taste%20Palo%20Alto", "s": "manual"}, {"n": "舞妓", "c": "desserts", "r": null, "a": null, "d": "太甜", "u": "https://www.google.com/maps/search/?api=1&query=%E8%88%9E%E5%A6%93%20%E6%B9%BE%E5%8C%BA", "s": "manual"}];
const CITIES = [ ["all","全部城市"], ["south_bay","南湾"], ["san_francisco","旧金山"], ["peninsula","半岛"], ["east_bay","东湾"], ["new_york","纽约"], ["other","其他"] ];
const CATS = [ ["all","全部菜系"], ["chinese","中餐"], ["asian","亚洲"], ["other","其他"], ["desserts","甜点"] ];
const CATNAME = { chinese:"中餐", asian:"亚洲", other:"其他", desserts:"甜点" };
const CITYNAME = { south_bay:"南湾", san_francisco:"旧金山", peninsula:"半岛", east_bay:"东湾", new_york:"纽约", other:"其他" };
let city="all", cat="all", last=null;

function mkPills(el, defs, get, set){
  defs.forEach(([v,t])=>{
    const b=document.createElement('button'); b.className='pill'+(get()===v?' on':''); b.textContent=t;
    b.onclick=()=>{ set(v); [...el.children].forEach(x=>x.classList.remove('on')); b.classList.add('on'); refresh(); };
    el.appendChild(b);
  });
}
mkPills(document.getElementById('cities'), CITIES, ()=>city, v=>city=v);
mkPills(document.getElementById('cats'), CATS, ()=>cat, v=>cat=v);

function poolItems(){
  return R.filter(x => (city==='all' || x.r===city) && (cat==='all' || x.c===cat));
}
function refresh(){
  const p=poolItems();
  document.getElementById('pool').innerHTML = '当前范围：<b>'+p.length+'</b> 家';
  document.getElementById('spin').disabled = p.length===0;
}
refresh();

const stage=document.getElementById('stage');
function esc(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
function showCard(x){
  last=x;
  const tags=[];
  if(x.r && CITYNAME[x.r]) tags.push('<span class="tag">'+CITYNAME[x.r]+'</span>');
  if(x.a) tags.push('<span class="tag">'+esc(x.a)+'</span>');
  tags.push('<span class="tag">'+CATNAME[x.c]+'</span>');
  if(x.s==='want_to_go') tags.push('<span class="tag want">想去</span>');
  if(x.s==='5star') tags.push('<span class="tag">收藏 ★5</span>');
  if(x.s==='4star') tags.push('<span class="tag">收藏 ★4</span>');
  stage.innerHTML = '<div class="card">'
    + '<div class="name">'+esc(x.n)+'</div>'
    + '<div class="meta">'+tags.join('')+'</div>'
    + (x.d ? '<p class="desc">'+esc(x.d)+'</p>' : '')
    + (x.u ? '<a class="go" target="_blank" rel="noopener" href="'+x.u+'">在 Google Maps 打开 →</a>' : '')
    + '<br><button class="again" id="again">不喜欢，再换一家</button></div>';
  document.getElementById('again').onclick = spin;
}
function spin(){
  const p=poolItems(); if(!p.length) return;
  const btn=document.getElementById('spin'); btn.disabled=true;
  let pick = p[Math.floor(Math.random()*p.length)];
  if(p.length>1 && last){ let t=0; while(pick===last && t<8){ pick=p[Math.floor(Math.random()*p.length)]; t++; } }
  let i=0; const total=16;
  stage.innerHTML='<p class="rolling" id="roll"></p>';
  const roll=document.getElementById('roll');
  const timer=setInterval(()=>{
    roll.textContent = p[Math.floor(Math.random()*p.length)].n;
    i++; if(i>=total){ clearInterval(timer); btn.disabled=false; showCard(pick); }
  }, 55);
}
document.getElementById('spin').onclick = spin;
</script>
