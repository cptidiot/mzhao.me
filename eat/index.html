<body>
<main class="wrap">
  <header class="intro">
    <div><h1>别纠结，<span>转一下。</span></h1><p>从收藏清单里随机挑一家，今晚就吃它。</p></div>

  </header>
  <section class="toolbar" aria-label="筛选餐厅">
    <div class="filters" id="categoryFilters"></div>
  </section>
  <div class="main-grid">
    <section class="wheel-wrap" aria-label="餐厅转盘">
      <div class="pointer" aria-hidden="true"></div>
      <div class="wheel" id="wheel"><canvas id="wheelCanvas" width="900" height="900"></canvas></div>
      <button class="spin" id="spinBtn" type="button">开转</button>
    </section>
    <aside class="side">
      <div class="pool-note" id="poolNote">正在整理餐厅池…</div>
      <section class="result" id="result" aria-live="polite"><p class="idle">默认从全部 142 个选择里随机抽<br>按一下中间的「开转」就好。</p></section>
      <div class="source-row"><strong>只看这份收藏</strong><div id="sourceFilters"></div></div>
    </aside>
  </div>
  <section class="catalog">
    <div class="catalog-head"><div><h2>转盘里有什么</h2><p id="catalogMeta"></p></div><input id="search" class="search" type="search" aria-label="搜索餐厅" placeholder="搜餐厅、菜系或城市"></div>
    <div class="cards" id="cards"></div><button class="more" id="moreBtn" type="button">再看一些</button>
  </section>
  <p class="foot">餐厅状态、营业时间与菜单可能变化，请以 Google Maps 页面为准。</p>
</main>

const C={all:{name:"全部随机",mark:"食"},c:{name:"中餐",mark:"中"},a:{name:"亚洲",mark:"亚"},o:{name:"其他",mark:"西"},d:{name:"甜品饮品",mark:"甜"}};

function badge(x){const cls=x.s==="5"?"b5":x.s==="4"?"b4":x.s==="w"?"bw":"bm";return `<span class="badge ${cls}">${S[x.s]}</span>`}
function renderFilters(){cats.innerHTML=Object.entries(C).map(([k,v])=>{const n=R.filter(x=>k==="all"||x.c===k).length;return `<button class="filter" data-cat="${k}" aria-pressed="${cat===k}">${v.name}<small>${n}</small></button>`}).join("");sources.innerHTML=Object.entries(S).map(([k,v])=>`<button class="source-filter" data-source="${k}" aria-pressed="${source===k}">${v}</button>`).join("");cats.querySelectorAll("button").forEach(b=>b.onclick=()=>{if(spinning)return;cat=b.dataset.cat;shown=12;render()});sources.querySelectorAll("button").forEach(b=>b.onclick=()=>{if(spinning)return;source=b.dataset.source;shown=12;render()})}

function renderCards(){const p=pool();$("#catalogMeta").textContent=`现在显示 ${p.length} 个选择`;$("#cards").innerHTML=p.slice(0,shown).map(x=>`<article class="card"><h3>${x.n}</h3><div class="badges">${badge(x)}<span class="badge">${C[x.c].name}</span></div><p>${x.d}</p><a href="${mapUrl(x)}" target="_blank" rel="noopener noreferrer">在地图里查看 ↗</a></article>`).join("")||'<div class="empty">没有找到匹配的餐厅。</div>';$("#moreBtn").hidden=shown>=p.length}
