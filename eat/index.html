<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今天吃什么</title>
<meta name="description" content="别纠结，交给运气 — 餐厅收藏大转盘">
<style>
  :root{
    --bg:#fff7e8; --surface:#fffdf7; --text:#2b211b; --muted:#8a7a6a;
    --accent:#e84a36; --accent-2:#f4b83e; --jade:#2c9b72;
    --border:#2b211b; --dot:rgba(43,33,27,.10);
    --shadow:5px 5px 0 rgba(43,33,27,.9);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#211813; --surface:#2c211a; --text:#f5e9dc; --muted:#b8a48f; --border:#f5e9dc; --dot:rgba(245,233,220,.10); --shadow:5px 5px 0 rgba(0,0,0,.55); }
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:ui-rounded,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    background-color:var(--bg);
    background-image:radial-gradient(var(--dot) 1.6px, transparent 1.6px);
    background-size:18px 18px;
    color:var(--text); min-height:100vh; padding:20px 16px 48px;
  }
  .home{ max-width:1040px; margin:0 auto 6px; }
  .home a{ color:var(--muted); text-decoration:none; font-size:14px; font-weight:600; }
  .home a:hover{ color:var(--accent); }
  .wrap{ max-width:1040px; margin:0 auto; }
  header{ text-align:center; margin:10px 0 20px; }
  header h1{ font-size:clamp(28px,5vw,40px); font-weight:900; letter-spacing:.5px; }
  header h1 .hl{ color:var(--accent); }
  header p{ margin-top:6px; color:var(--muted); font-size:16px; font-weight:600; }
  .card{
    background:var(--surface); border:2px solid var(--border); border-radius:20px;
    box-shadow:var(--shadow); padding:16px; margin-bottom:18px;
  }
  .flabel{ font-size:13px; font-weight:800; color:var(--muted); letter-spacing:2px; margin-bottom:10px; }
  .tabs{ display:flex; flex-wrap:wrap; gap:10px; }
  .tab{
    display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none;
    background:var(--surface); border:2px solid var(--border); border-radius:999px;
    padding:6px 14px 6px 7px; font-size:15px; font-weight:700; transition:transform .08s;
  }
  .tab:hover{ transform:translate(-1px,-1px); }
  .tab .stamp{
    width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:var(--accent-2); border:2px solid var(--border); font-size:15px; font-weight:900;
  }
  .tab .cnt{ font-size:12px; color:var(--muted); font-weight:700; }
  .tab.active{ background:var(--accent); color:#fff; }
  .tab.active .cnt{ color:rgba(255,255,255,.85); }
  .tab.active .stamp{ background:#fff; color:var(--accent); }
  .pills,.chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .pill,.chip{
    cursor:pointer; user-select:none; background:var(--surface); border:2px solid var(--border);
    border-radius:999px; padding:5px 13px; font-size:14px; font-weight:700; transition:transform .08s;
  }
  .pill:hover,.chip:hover{ transform:translate(-1px,-1px); }
  .pill .cnt,.chip .cnt{ font-size:12px; color:var(--muted); margin-left:2px; }
  .pill.active{ background:var(--jade); color:#fff; } .pill.active .cnt{ color:rgba(255,255,255,.85); }
  .chip.active{ background:var(--accent-2); } .chip.active .cnt{ color:rgba(43,33,27,.6); }
  #areaRow{ display:none; }
  .main{ display:grid; grid-template-columns:1fr; gap:18px; }
  @media (min-width:760px){ .main{ grid-template-columns:1fr 320px; align-items:start; } }
  .wheelbox{ position:relative; padding:10px; }
  .wheelwrap{ position:relative; max-width:640px; margin:0 auto; }
  canvas#wheel{ width:100%; height:auto; display:block; }
  .pointer{
    position:absolute; top:-6px; left:50%; transform:translateX(-50%); z-index:3;
    width:0; height:0; border-left:16px solid transparent; border-right:16px solid transparent;
    border-top:26px solid var(--accent); filter:drop-shadow(0 2px 0 rgba(43,33,27,.6));
  }
  #spinBtn{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:4;
    width:84px; height:84px; border-radius:50%; cursor:pointer;
    background:var(--accent); color:#fff; border:3px solid var(--border);
    box-shadow:3px 3px 0 rgba(43,33,27,.9); font-size:30px; font-weight:900;
    display:flex; align-items:center; justify-content:center; transition:transform .08s;
  }
  #spinBtn:hover{ transform:translate(-50%,-50%) scale(1.05); }
  #spinBtn:disabled{ opacity:.55; cursor:default; }
  .panel h2{ font-size:19px; font-weight:900; margin-bottom:8px; }
  .panel .range{ color:var(--muted); font-weight:700; font-size:14px; margin-bottom:14px; }
  .bigbtn{
    width:100%; cursor:pointer; background:var(--accent); color:#fff; border:2px solid var(--border);
    border-radius:16px; box-shadow:4px 4px 0 rgba(43,33,27,.9); padding:14px;
    font-size:18px; font-weight:900; letter-spacing:1px; transition:transform .08s;
  }
  .bigbtn:hover{ transform:translate(-1px,-1px); }
  .bigbtn:disabled{ opacity:.55; cursor:default; }
  .ticket{
    display:none; margin-top:16px; background:var(--bg); border:2px dashed var(--border);
    border-radius:16px; padding:16px; position:relative;
  }
  .ticket.show{ display:block; animation:pop .45s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop{ 0%{ transform:scale(.8) rotate(-2deg); opacity:0; } 100%{ transform:scale(1) rotate(0); opacity:1; } }
  .ticket .stamp2{
    display:inline-block; background:var(--accent); color:#fff; font-weight:900; font-size:13px;
    padding:3px 10px; border-radius:999px; border:2px solid var(--border); transform:rotate(-3deg);
  }
  .ticket h3{ font-size:24px; font-weight:900; margin:10px 0 6px; line-height:1.25; }
  .badges{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .badge{ font-size:12px; font-weight:800; border:2px solid var(--border); border-radius:999px; padding:2px 9px; background:var(--accent-2); }
  .badge.jade{ background:var(--jade); color:#fff; }
  .badge.plain{ background:var(--surface); }
  .ticket .loc{ font-weight:700; font-size:14px; margin-bottom:6px; }
  .ticket .desc{ font-size:14px; line-height:1.55; color:var(--text); opacity:.85; }
  .ticket .row{ display:flex; gap:8px; margin-top:14px; }
  .ticket a.maps,.ticket button.again{
    flex:1; text-align:center; text-decoration:none; cursor:pointer; font-size:15px; font-weight:900;
    border:2px solid var(--border); border-radius:12px; padding:10px 6px;
  }
  .ticket a.maps{ background:var(--jade); color:#fff; box-shadow:3px 3px 0 rgba(43,33,27,.9); }
  .ticket button.again{ background:var(--surface); color:var(--text); box-shadow:3px 3px 0 rgba(43,33,27,.9); font-family:inherit; }
  #q{ width:100%; padding:10px 14px; font-size:15px; font-weight:600; font-family:inherit;
    border:2px solid var(--border); border-radius:12px; background:var(--surface); color:var(--text); margin-bottom:10px; }
  #poolList{ max-height:330px; overflow:auto; }
  .prow{ display:flex; align-items:baseline; gap:10px; padding:8px 6px; border-bottom:1px dashed var(--dot); cursor:pointer; }
  .prow:hover{ background:var(--bg); }
  .prow .pn{ font-weight:800; font-size:15px; }
  .prow .pl{ color:var(--muted); font-weight:600; font-size:13px; white-space:nowrap; }
  .prow .ps{ margin-left:auto; display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; }
  .prow .pb{ font-size:11px; font-weight:800; border:1.5px solid var(--border); border-radius:999px; padding:1px 7px; background:var(--accent-2); }
  .prow .pb.jade{ background:var(--jade); color:#fff; }
  .prow .pb.plain{ background:var(--surface); }
  .pmore{ padding:10px 6px; color:var(--muted); font-weight:600; font-size:13px; }
  footer{ max-width:1040px; margin:22px auto 0; text-align:center; color:var(--muted); font-size:13px; font-weight:600; line-height:1.7; }
</style>
</head>
<body>
<div class="home"><a href="/">Home</a></div>
<div class="wrap">
  <header>
    <h1>别想了，<span class="hl">转！</span></h1>
    <p>别纠结，交给运气 🍜</p>
  </header>

  <div class="card">
    <div class="flabel">快 捷 入 口</div>
    <div class="pills">
      <div class="pill" id="presetFresh">🌉 湾区尝鲜 · Want to go</div>
      <div class="pill" id="presetReturn">⭐ 湾区回锅 · 有星级</div>
    </div>
  </div>

  <div class="card">
    <div class="flabel">菜 系</div>
    <div class="tabs" id="catTabs"></div>
  </div>

  <div class="card">
    <div class="flabel">来 源</div>
    <div class="pills" id="srcPills"></div>
    <div class="flabel" style="margin-top:16px">地 区</div>
    <div class="chips" id="regChips"></div>
    <div id="areaRow">
      <div class="flabel" style="margin-top:16px">区 域</div>
      <div class="chips" id="areaChips"></div>
    </div>
  </div>

  <div class="main">
    <div class="card wheelbox">
      <div class="wheelwrap">
        <div class="pointer"></div>
        <canvas id="wheel" width="680" height="680"></canvas>
        <button id="spinBtn" title="转一转" disabled>转</button>
      </div>
    </div>
    <div class="card panel">
      <h2>天意在此</h2>
      <div class="range" id="rangeText"></div>
      <button class="bigbtn" id="bigSpin" disabled>转动转盘 🎲</button>
      <div class="ticket" id="ticket">
        <span class="stamp2">就吃这个！</span>
        <h3 id="tName"></h3>
        <div class="badges" id="tBadges"></div>
        <div class="loc" id="tLoc"></div>
        <div class="desc" id="tDesc"></div>
        <div class="row">
          <a class="maps" id="tMaps" href="#" target="_blank" rel="noopener">📍 Google Maps</a>
          <button class="again" id="tAgain">再转一次</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="flabel">当 前 池 名 单</div>
    <input id="q" type="search" placeholder="搜店名 / 城市…" autocomplete="off">
    <div id="poolList"></div>
  </div>

  <footer>
    <span id="footCount">…</span>
  </footer>
</div>

<script>
let DATA = [];
const CATS = [ ['all','全部','全'], ['chinese','中餐','中'], ['asian','亚洲','亚'], ['other','其他','其'], ['desserts','甜品饮品','甜'] ];
const CATNAME = { chinese:'中餐', asian:'亚洲', other:'其他', desserts:'甜品饮品' };
const SRCS = [ ['all','全部来源'], ['want_to_go','Want to go'], ['been','去过'], ['fresh','没去过'], ['starred','有星级'], ['5star','5★ 收藏'], ['4star','4★ 收藏'], ['favorites','Favorites'], ['manual','自选'] ];
const SRCNAME = { '5star':'5★ 收藏', '4star':'4★ 收藏', 'want_to_go':'Want to go', 'been':'去过', 'favorites':'♥ Favorites', 'manual':'自选' };
const REGS = [ ['all','全部地区'], ['bay_area','湾区'], ['south_bay','南湾'], ['peninsula','半岛'], ['san_francisco','旧金山'], ['east_bay','东湾'], ['new_york','纽约'], ['other','其他地区'] ];
const REGNAME = { bay_area:'湾区', south_bay:'南湾', peninsula:'半岛', san_francisco:'旧金山', east_bay:'东湾', new_york:'纽约', other:'其他地区' };
const COLORS = ['#F4B83E','#E84A36','#2C9B72','#F07A4E','#F1CE70','#5CB894','#D94C39','#E8A940'];

let fCat='all', fSrc='all', fReg='bay_area', fArea='all';
const BAY = ['south_bay','peninsula','san_francisco','east_bay'];
const excluded = new Set();
function srcMatch(x,k){
  if(k==='been') return x.s.some(s=>s==='been'||s==='5star'||s==='4star');
  if(k==='fresh') return !x.s.some(s=>s==='been'||s==='5star'||s==='4star');
  if(k==='starred') return x.s.some(s=>s==='5star'||s==='4star');
  return x.s.includes(k);
}
function regMatch(x){ return fReg==='all' ? true : (fReg==='bay_area' ? BAY.includes(x.r) : x.r===fReg); }
function keyOf(x){ return x.n+'\u0001'+x.u; }
let angle=0, spinning=false, slices=[], winnerIdx=-1, winner=null;

const $=id=>document.getElementById(id);

function pool(){
  return DATA.filter(x =>
    (fCat==='all'||x.c===fCat) &&
    (fSrc==='all'||srcMatch(x,fSrc)) &&
    regMatch(x) &&
    (fArea==='all'||x.a===fArea) &&
    !excluded.has(keyOf(x)));
}
function countBy(fn, list){ const m={}; list.forEach(x=>{ const k=fn(x); m[k]=(m[k]||0)+1; }); return m; }

function renderFilters(){
  const catCounts = countBy(x=>x.c, DATA);
  $('catTabs').innerHTML = CATS.map(([k,name,stamp])=>{
    const n = k==='all'?DATA.length:(catCounts[k]||0);
    return `<div class="tab ${fCat===k?'active':''}" data-cat="${k}"><span class="stamp">${stamp}</span>${name}<span class="cnt">${n}</span></div>`;
  }).join('');
  document.querySelectorAll('[data-cat]').forEach(el=>el.onclick=()=>{ fCat=el.dataset.cat; reset(); });

  const srcInCat = DATA.filter(x=>fCat==='all'||x.c===fCat);
  $('srcPills').innerHTML = SRCS.map(([k,name])=>{
    const n = k==='all'?srcInCat.length:srcInCat.filter(x=>srcMatch(x,k)).length;
    return `<div class="pill ${fSrc===k?'active':''}" data-src="${k}">${name}<span class="cnt">${n}</span></div>`;
  }).join('');
  document.querySelectorAll('[data-src]').forEach(el=>el.onclick=()=>{ fSrc=el.dataset.src; reset(); });

  const regBase = DATA.filter(x=>(fCat==='all'||x.c===fCat)&&(fSrc==='all'||srcMatch(x,fSrc)));
  const regCounts = countBy(x=>x.r||'none', regBase);
  $('regChips').innerHTML = REGS.map(([k,name])=>{
    const n = k==='all'?regBase.length:(k==='bay_area'?BAY.reduce((a,r)=>a+(regCounts[r]||0),0):(regCounts[k]||0));
    return `<div class="chip ${fReg===k?'active':''}" data-reg="${k}">${name}<span class="cnt">${n}</span></div>`;
  }).join('');
  document.querySelectorAll('[data-reg]').forEach(el=>el.onclick=()=>{ fReg=el.dataset.reg; fArea='all'; reset(); });

  if(fReg!=='all'&&fReg!=='bay_area'){
    const areas = [...new Set(regBase.filter(x=>x.r===fReg&&x.a).map(x=>x.a))].sort();
    const areaCounts = countBy(x=>x.a, regBase.filter(x=>x.r===fReg));
    $('areaRow').style.display='block';
    $('areaChips').innerHTML = [`<div class="chip ${fArea==='all'?'active':''}" data-area="all">全部区域</div>`]
      .concat(areas.map(a=>`<div class="chip ${fArea===a?'active':''}" data-area="${a}">${a}<span class="cnt">${areaCounts[a]||0}</span></div>`)).join('');
    document.querySelectorAll('[data-area]').forEach(el=>el.onclick=()=>{ fArea=el.dataset.area; reset(); });
  } else {
    $('areaRow').style.display='none';
  }
  $('rangeText').textContent = `当前范围：${pool().length} 家` + (excluded.size?`（本次已排除 ${excluded.size} 家）`:'');
  renderList();
}

function buildSlices(){
  const p = pool();
  if(!p.length){ slices=[]; winner=null; return; }
  winner = p[Math.floor(Math.random()*p.length)];
  if(p.length<=24){ slices=p.slice(); }
  else{
    const others = p.filter(x=>x!==winner);
    for(let i=others.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [others[i],others[j]]=[others[j],others[i]]; }
    slices = others.slice(0,23); slices.splice(Math.floor(Math.random()*24),0,winner);
  }
  winnerIdx = slices.indexOf(winner);
}

function drawWheel(){
  const cv=$('wheel'), ctx=cv.getContext('2d');
  const W=cv.width, C=W/2, R=C-14;
  ctx.clearRect(0,0,W,W);
  ctx.save(); ctx.translate(C,C); ctx.rotate(angle);
  const n = slices.length;
  if(n===0){
    ctx.beginPath(); ctx.arc(0,0,R,0,Math.PI*2); ctx.fillStyle='#e8dcc8'; ctx.fill();
  } else {
    const step = Math.PI*2/n;
    for(let i=0;i<n;i++){
      ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,R,i*step, (i+1)*step); ctx.closePath();
      ctx.fillStyle = COLORS[i%COLORS.length]; ctx.fill();
      ctx.lineWidth=3; ctx.strokeStyle='#2b211b'; ctx.stroke();
    }
    if(n<=14){
      ctx.fillStyle='#2b211b'; ctx.font='700 21px "PingFang SC","Microsoft YaHei",sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      for(let i=0;i<n;i++){
        ctx.save(); ctx.rotate((i+0.5)*step);
        let name = slices[i].n; if(name.length>11) name=name.slice(0,11)+'…';
        ctx.fillText(name, R*0.62, 0);
        ctx.restore();
      }
    }
  }
  ctx.restore();
  // rim + centre
  ctx.beginPath(); ctx.arc(C,C,R,0,Math.PI*2); ctx.lineWidth=6; ctx.strokeStyle='#2b211b'; ctx.stroke();
  if(pool().length>24){
    ctx.beginPath(); ctx.arc(C,C,58,0,Math.PI*2); ctx.fillStyle='#fffdf7'; ctx.fill();
    ctx.lineWidth=3; ctx.strokeStyle='#2b211b'; ctx.stroke();
    ctx.fillStyle='#2b211b'; ctx.font='900 25px "PingFang SC",sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(pool().length+' 家', C, C+2);
  }
}

function bezier(t){ // cubic-bezier(0.12,0.72,0.1,1) approx via standard easing solver
  const p0=0.12,p1=0.72,p2=0.1,p3=1;
  let lo=0,hi=1,u=t;
  for(let i=0;i<24;i++){ u=(lo+hi)/2; const x=3*(1-u)*(1-u)*u*p0+3*(1-u)*u*u*p2+u*u*u; if(x<t) lo=u; else hi=u; }
  return 3*(1-u)*(1-u)*u*p1+3*(1-u)*u*u*p3+u*u*u;
}

function spin(){
  if(winner && $('ticket').classList.contains('show')) excluded.add(keyOf(winner));
  let p = pool();
  if(!p.length && excluded.size){ excluded.clear(); renderFilters(); p = pool(); }
  if(spinning||!p.length) return;
  buildSlices(); drawWheel();
  spinning=true; $('spinBtn').disabled=true; $('bigSpin').disabled=true;
  $('ticket').classList.remove('show');
  const n=slices.length, step=Math.PI*2/n;
  const target = Math.PI*1.5 - (winnerIdx+0.5)*step; // pointer at top (-90deg = 1.5PI)
  const startMod = ((angle % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
  let delta = (target - startMod + Math.PI*2) % (Math.PI*2);
  const total = Math.PI*2*6 + delta;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dur = reduced?80:2400, t0=performance.now(), a0=angle;
  function frame(t){
    const k=Math.min(1,(t-t0)/dur);
    angle = a0 + total*bezier(k);
    drawWheel();
    if(k<1) requestAnimationFrame(frame);
    else{ spinning=false; $('spinBtn').disabled=false; $('bigSpin').disabled=false; showTicket(); }
  }
  requestAnimationFrame(frame);
}

function showTicket(){
  if(!winner) return;
  $('tName').textContent = winner.n;
  const badges = [`<span class="badge plain">${CATNAME[winner.c]}</span>`]
    .concat(winner.s.filter(s=>s!=='manual').map(s=>`<span class="badge ${s==='want_to_go'?'jade':''}">${SRCNAME[s]||s}</span>`));
  $('tBadges').innerHTML = badges.join('');
  const loc = winner.r ? (REGNAME[winner.r] + (winner.a? ' · '+winner.a : '')) : (winner.a||'');
  $('tLoc').textContent = loc? '📍 '+loc : '';
  $('tDesc').textContent = winner.d||'';
  $('tMaps').href = winner.u;
  $('ticket').classList.add('show');
}

function reset(){ angle=0; winner=null; excluded.clear(); $('ticket').classList.remove('show'); renderFilters(); buildSlices(); drawWheel(); }

function renderList(){
  const box = $('poolList'); if(!box) return;
  const q = ($('q').value||'').trim().toLowerCase();
  let items = pool();
  if(q) items = items.filter(x => x.n.toLowerCase().includes(q) || (x.a||'').toLowerCase().includes(q));
  const MAX = 300;
  const rows = items.slice(0, MAX).map(x=>{
    const loc = x.r ? (REGNAME[x.r] + (x.a? ' · '+x.a : '')) : (x.a||'');
    const bs = x.s.filter(s=>s!=='manual').map(s=>`<span class="pb ${s==='want_to_go'?'jade':''}">${SRCNAME[s]||s}</span>`).join('');
    return `<div class="prow" data-i="${DATA.indexOf(x)}"><span class="pn">${x.n}</span><span class="pl">${loc}</span><span class="ps"><span class="pb plain">${CATNAME[x.c]}</span>${bs}</span></div>`;
  }).join('');
  box.innerHTML = rows + (items.length>MAX ? `<div class="pmore">仅显示前 ${MAX} 家（共 ${items.length} 家），缩小筛选或搜索查看更多</div>` : '')
    + (!items.length ? '<div class="pmore">当前筛选下没有店</div>' : '');
  box.querySelectorAll('.prow').forEach(el=>el.onclick=()=>{
    winner = DATA[+el.dataset.i];
    showTicket();
    $('ticket').scrollIntoView({behavior:'smooth', block:'center'});
  });
}
$('q').addEventListener('input', renderList);
$('presetFresh').onclick=()=>{ fCat='all'; fSrc='want_to_go'; fReg='bay_area'; fArea='all'; reset(); };
$('presetReturn').onclick=()=>{ fCat='all'; fSrc='starred'; fReg='bay_area'; fArea='all'; reset(); };

$('spinBtn').onclick=spin; $('bigSpin').onclick=spin; $('tAgain').onclick=spin;
$('rangeText').textContent='数据加载中…';
drawWheel();
fetch('data.json').then(r=>{ if(!r.ok) throw new Error('bad'); return r.json(); })
 .then(d=>{ DATA=d; $('footCount').textContent=DATA.length+' 家'; $('spinBtn').disabled=false; $('bigSpin').disabled=false; reset(); })
 .catch(()=>{ $('rangeText').textContent='数据加载失败，请刷新重试'; });
