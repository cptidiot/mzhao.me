<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>{{ page.title }}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232e3d4a'/%3E%3Ctext x='32' y='44' font-family='Helvetica, Arial, sans-serif' font-size='36' font-weight='500' fill='%23ffffff' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#fafaf8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0c0c" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #fafaf8; --ink: #111111; --body: #3a3a38; --muted: #8e8e89;
    --line: rgba(17, 17, 17, .1); --rule: #111111; --red: #e8261c;
    --serif: "Instrument Serif", "Iowan Old Style", "Times New Roman", serif;
    --sans: "Inter", "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0c0c0c; --ink: #f1f1ee; --body: #bdbdb8; --muted: #76766f; --line: rgba(241, 241, 238, .12); --rule: #f1f1ee; --red: #ff4a3d; color-scheme: dark; }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { background: var(--bg); color: var(--body); font-family: var(--sans); -webkit-font-smoothing: antialiased; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  a { color: inherit; }
  .wrap { max-width: 720px; margin: 0 auto; padding-block: 48px 96px; }
  .top { display: flex; justify-content: space-between; font: 500 12px/1 var(--sans); color: var(--muted); }
  .top a { text-decoration: none; }
  .top a:hover { color: var(--ink); }
  h1 { margin-top: 48px; font: 400 clamp(30px, 5.6vw, 44px)/1.12 var(--serif); letter-spacing: -.01em; color: var(--ink); text-wrap: balance; }
  .meta { margin-top: 14px; font: 500 11.5px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums; }
  .meta b { color: var(--red); font-weight: 600; }
  .redline { display: block; width: 56px; height: 4px; margin: 18px 0 26px; background: var(--red); }
  .text { overflow-wrap: anywhere; font-size: 15px; line-height: 1.7; color: var(--body); }
  .text p, .text ul, .text ol, .text blockquote { margin-bottom: .8em; }
  .text > :last-child { margin-bottom: 0; }
  .text h2 { font: 600 17px/1.4 var(--sans); color: var(--ink); margin: 1.3em 0 .5em; }
  .text h3 { font: 600 15px/1.45 var(--sans); color: var(--ink); margin: 1.25em 0 .4em; }
  .text ul, .text ol { padding-left: 1.2em; }
  .text li { margin-bottom: .3em; }
  .text blockquote { padding-left: 12px; border-left: 2px solid var(--line); color: var(--muted); }
  .text a { color: var(--ink); text-decoration-color: var(--red); text-decoration-thickness: 1.5px; text-underline-offset: 3px; overflow-wrap: anywhere; }
  .text a:hover { color: var(--red); }
  .text strong { color: var(--ink); }
  .back { margin-top: 44px; padding-top: 14px; border-top: 2px solid var(--rule); font: 600 12px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; }
  .back a { text-decoration: none; }
  .back a:hover { color: var(--red); }
  @media (max-width: 560px) { .wrap { padding-block: 32px 72px; } h1 { margin-top: 36px; } .redline { width: 44px; height: 3px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="/">Home</a><a href="/digest/">Digest</a></div>
  <h1>{{ page.title }}</h1>
  <p class="meta"><b>{{ page.section_name }}</b> · {{ page.date | date: "%B %-d, %Y · %-I:%M %p" }}</p>
  <span class="redline" aria-hidden="true"></span>
  <div class="text">{{ content }}</div>
  <div class="back"><a href="/digest/">← All digests</a></div>
</div>
<script>
(function () {
  // Safety net: turn any remaining bare URLs in the body into links.
  var re = /(https?:\/\/[^\s<>\])）]+)/g;
  document.querySelectorAll('.text').forEach(function (el) {
    var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, {
      acceptNode: function (n) {
        return n.parentElement.closest('a, code, pre') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT;
      }
    });
    var nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(function (n) {
      if (!/https?:\/\//.test(n.textContent)) return;
      var frag = document.createDocumentFragment(), last = 0, m;
      re.lastIndex = 0;
      while ((m = re.exec(n.textContent))) {
        var url = m[1].replace(/[。，、；：!?…]+$/, '');
        frag.appendChild(document.createTextNode(n.textContent.slice(last, m.index)));
        var a = document.createElement('a');
        a.href = url; a.textContent = url;
        frag.appendChild(a);
        last = m.index + url.length;
      }
      frag.appendChild(document.createTextNode(n.textContent.slice(last)));
      n.replaceWith(frag);
    });
  });
})();
</script>

</body>
</html>
