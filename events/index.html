<style>
  .head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px 40px; padding: 28px 0 18px; }
  .head-copy { display: flex; flex-direction: column; gap: 8px; min-width: 0; flex: 1 1 320px; }
  .eyebrow { margin: 0; font: 600 12px/1 var(--sans); letter-spacing: .08em; color: var(--redtext); }
  h1 { margin: 0; font: 600 30px/1.25 var(--sans); letter-spacing: -.01em; color: var(--ink); }
  .sub { margin: 0; font-size: 13px; line-height: 1.5; color: var(--muted); font-variant-numeric: tabular-nums; }
  .search { display: flex; align-items: center; gap: 10px; flex: 0 1 320px; min-height: 44px; padding: 0 16px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--muted); }
  .search input { flex: 1; min-width: 0; height: 42px; border: 0; outline: 0; background: transparent; font-size: 16px; color: var(--ink); }
  .search:focus-within { border-color: var(--ink); }

  .toolbar { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding: 10px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--bg); }
  .tabs { display: flex; gap: 6px; }
  .tab { display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); font: 500 14px/1 var(--sans); color: var(--ink); cursor: pointer; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tab small { font-size: 12px; color: var(--muted); }
  .tab .d-short { display: none; }
  .tab[aria-selected="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); font-weight: 600; }
  .tab[aria-selected="true"] small { color: inherit; }
  .tab.past { background: transparent; color: var(--muted); }
  .tab.past .d-long, .tab.past .d-short { text-decoration: line-through; }
  .tab.past[aria-selected="true"] { background: var(--muted); border-color: var(--muted); color: var(--bg); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: flex; align-items: center; gap: 6px; flex: none; min-height: 44px; padding: 0 13px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); font: 500 14px/1 var(--sans); color: var(--ink); white-space: nowrap; cursor: pointer; }
  .chip span { font-size: 13px; opacity: .7; font-variant-numeric: tabular-nums; }
  .chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }
  .chip:disabled { background: transparent; color: var(--muted); opacity: .55; cursor: default; }
  .chip-sep { flex: none; width: 1px; align-self: stretch; margin: 8px 4px; background: var(--line); }

  .status { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 16px; min-height: 44px; margin-top: 12px; font-size: 14px; color: var(--text); }
  .status strong { font-weight: 600; color: var(--ink); }
  .linkbtn { min-height: 44px; padding: 0; border: 0; background: transparent; font: 600 14px/1 var(--sans); color: var(--redtext); cursor: pointer; }

  .layout { display: block; }
  .group-h { display: flex; justify-content: space-between; align-items: baseline; margin: 24px 0 0; padding-bottom: 8px; border-bottom: 1px solid var(--ink); font: 600 14px/1 var(--sans); color: var(--ink); }
  .group-h span { font-weight: 500; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .row { border-bottom: 1px solid var(--line); scroll-margin-top: 150px; }
  .row-btn { display: flex; align-items: flex-start; gap: 12px; width: 100%; padding: 14px 0; border: 0; background: transparent; text-align: left; cursor: pointer; }
  .row-time { flex: none; width: 46px; padding-top: 2px; font: 600 15px/1.4 var(--sans); color: var(--ink); font-variant-numeric: tabular-nums; }
  .row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .pick { font: 600 12px/1.2 var(--sans); letter-spacing: .04em; color: var(--redtext); }
  .row-title { font: 600 17px/1.4 var(--sans); color: var(--ink); overflow-wrap: anywhere; }
  .row-place { font-size: 14px; line-height: 1.45; color: var(--muted); }
  .row-when { font-size: 14px; line-height: 1.45; color: var(--text); font-variant-numeric: tabular-nums; }
  .chev { flex: none; margin-top: 4px; color: var(--muted); transition: transform .15s; }
  .row-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .detail { display: flex; flex-direction: column; gap: 12px; }
  .row .detail { padding: 0 0 18px 58px; }
  .detail p { margin: 0; }
  .detail .desc { font-size: 15px; line-height: 1.7; color: var(--text); }
  .detail .meta { font-size: 13px; line-height: 1.5; color: var(--muted); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { padding: 4px 9px; border: 1px solid var(--line); border-radius: 999px; font-size: 12px; line-height: 1.3; color: var(--muted); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); font: 500 14px/1 var(--sans); color: var(--ink); }
  .btn.primary { padding: 0 16px; border-color: var(--ink); background: var(--ink); font-weight: 600; color: var(--bg); }
  .empty { margin-top: 24px; padding: 40px 20px; border: 1px dashed var(--line); border-radius: 10px; text-align: center; color: var(--muted); }
  .aside { display: none; }

  .foot { margin: 40px 0 0; padding: 4px 0 48px; border-top: 1px solid var(--line); }
  .foot summary { display: flex; align-items: center; justify-content: space-between; min-height: 48px; font: 500 14px/1 var(--sans); color: var(--ink); cursor: pointer; list-style: none; }
  .foot summary::-webkit-details-marker { display: none; }
  .foot details[open] .chev { transform: rotate(180deg); }
  .foot .notes { display: flex; flex-direction: column; gap: 12px; padding: 4px 0 16px; font-size: 13px; line-height: 1.7; color: var(--text); }
  .foot .notes p { margin: 0; }
  .foot .notes strong { color: var(--ink); }
  .foot .fine { margin: 0; font-size: 13px; line-height: 1.6; color: var(--muted); }

  @media (min-width: 960px) {
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 0 40px; align-items: start; }
    .row { border-bottom: 0; }
    .row-btn { margin-top: 6px; padding: 12px 14px; border: 1px solid transparent; border-radius: 8px; }
    .row-btn:hover { border-color: var(--line); }
    .row-btn[aria-expanded="true"] { border-color: var(--ink); background: var(--card); }
    .row .detail, .chev-row { display: none; }
    .row-time { width: 52px; }
    .aside { display: flex; flex-direction: column; gap: 14px; position: sticky; top: 96px; margin-top: 24px; padding: 24px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
    .aside h2 { margin: 0; font: 600 24px/1.3 var(--sans); letter-spacing: -.01em; color: var(--ink); }
    .facts { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); font-size: 15px; line-height: 1.5; color: var(--ink); }
    .facts div { display: flex; gap: 10px; }
    .facts dt { flex: none; width: 40px; color: var(--muted); }
    .facts dd { margin: 0; }
  }
  @media (max-width: 640px) {
    .head { padding: 20px 0 14px; }
    h1 { font-size: 24px; line-height: 1.3; }
    .search { flex-basis: 100%; }
    .toolbar { margin: 0 -16px; padding: 10px 16px 0; gap: 10px; }
    .tabs { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); width: 100%; }
    .tab { flex-direction: column-reverse; justify-content: center; gap: 5px; min-height: 52px; padding: 0 4px; }
    .tab .d-long { display: none; }
    .tab .d-short { display: inline; font-weight: 600; }
    .tab small:empty::after { content: "\00a0"; }
    .chips { flex-wrap: nowrap; width: calc(100% + 32px); margin: 0 -16px; padding: 0 16px 10px; overflow-x: auto; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { padding: 0 14px; }
  }
  @media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
</style>
</head>

<div class="wrap">

<header class="sitebar">

<main>
  <section class="head">

<script>
(function () {
  'use strict';
  var TZ = 'America/Los_Angeles';
  var REGIONS = [['sf', '旧金山'], ['east-bay', '东湾'], ['south-bay', '南湾'], ['peninsula', '半岛'], ['north-bay', '北湾']];
  var FLAGS = [['free', '免费'], ['outdoor', '户外'], ['family', '亲子']];
  var REGION_NAME = {}; REGIONS.forEach(function (r) { REGION_NAME[r[0]] = r[1]; });
  var WD = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var safeUrl = function (u) { return /^https?:\/\//i.test(u || '') ? u : '#'; };
  var CHEV = '<svg class="chev chev-row" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
  var PIN = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';
  var CAL = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/></svg>';

  var data = null, days = [], byId = {};
  var state = { day: null, filters: {}, q: '', open: null };

  function todayStr() {
    try { return new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()); }
    catch (e) { return new Date().toISOString().slice(0, 10); }
  }
  function parts(d) { var p = d.split('-').map(Number); return { m: p[1], d: p[2], wd: new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay() }; }
  function dayDiff(a, b) { return Math.round((Date.parse(a + 'T00:00:00Z') - Date.parse(b + 'T00:00:00Z')) / 864e5); }
  function longDay(d) { var p = parts(d); return WD[p.wd] + ' ' + p.m + '/' + p.d; }
  function sessionOn(e, d) { for (var i = 0; i < e.sessions.length; i++) if (e.sessions[i].date === d) return e.sessions[i]; return null; }
  function whenText(e, s) {
    if (e.time_note) return e.time_note;
    if (!s || !s.start) return '时间待定';
    return s.end ? s.start + '–' + s.end : s.start;
  }
  function matchFilters(e, skip) {
    var regs = REGIONS.filter(function (r) { return state.filters[r[0]] && r[0] !== skip; }).map(function (r) { return r[0]; });
    if (regs.length && regs.indexOf(e.region) < 0) return false;
    for (var i = 0; i < FLAGS.length; i++) { var k = FLAGS[i][0]; if (k !== skip && state.filters[k] && !e[k]) return false; }
    return true;
  }
  function matchQuery(e) {
    var q = state.q.trim().toLowerCase(); if (!q) return true;
    return [e.title, e.title_en, e.city, e.venue, e.address, e.source, REGION_NAME[e.region], (e.tags || []).join(' '), e.desc].join(' ').toLowerCase().indexOf(q) >= 0;
  }
  function isPick(e, d) { var day = days.filter(function (x) { return x.date === d; })[0]; return !!(day && day.picks && day.picks.indexOf(e.id) >= 0); }

  function readUrl() {
    var p = new URLSearchParams(location.search);
    var d = p.get('day'); if (d && days.some(function (x) { return x.date === d; })) state.day = d;
    (p.get('f') || '').split(',').forEach(function (k) { if (REGION_NAME[k] || FLAGS.some(function (x) { return x[0] === k; })) state.filters[k] = true; });
    state.q = p.get('q') || '';
    var h = decodeURIComponent(location.hash.slice(1)); if (h && byId[h]) state.open = h;
  }
  function writeUrl() {
    var p = new URLSearchParams();
    if (state.day) p.set('day', state.day);
    var f = Object.keys(state.filters).filter(function (k) { return state.filters[k]; }); if (f.length) p.set('f', f.join(','));
    if (state.q.trim()) p.set('q', state.q.trim());
    var qs = p.toString();
    history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '') + (state.open ? '#' + encodeURIComponent(state.open) : ''));
  }
  function defaultDay() {
    var t = todayStr();
    for (var i = 0; i < days.length; i++) if (days[i].date >= t) return days[i].date;
    return days.length ? days[days.length - 1].date : null;
  }

  function renderTabs() {
    var t = todayStr();
    $('tabs').innerHTML = days.map(function (d) {
      var diff = dayDiff(d.date, t), p = parts(d.date);
      var label = diff < 0 ? '已结束' : diff === 0 ? '今天' : diff === 1 ? '明天' : '';
      var sel = !state.q.trim() && state.day === d.date;
      return '<button class="tab' + (diff < 0 ? ' past' : '') + '" type="button" role="tab" aria-selected="' + sel + '" data-day="' + d.date + '">' +
        '<span class="d-long">' + longDay(d.date) + '</span><span class="d-short">' + WD[p.wd].slice(1) + ' ' + p.d + '</span><small>' + label + '</small></button>';
    }).join('');
  }
  function renderChips() {
    var pool = data.events.filter(function (e) { return state.q.trim() ? matchQuery(e) : !!sessionOn(e, state.day); });
    var chip = function (k, name) {
      var n = pool.filter(function (e) { return matchFilters(e, k) && (REGION_NAME[k] ? e.region === k : !!e[k]); }).length;
      var on = !!state.filters[k];
      return '<button class="chip" type="button" data-f="' + k + '" aria-pressed="' + on + '"' + (n === 0 && !on ? ' disabled' : '') + '>' + name + '<span>' + n + '</span></button>';
    };
    $('chips').innerHTML = REGIONS.map(function (r) { return chip(r[0], r[1]); }).join('') + '<i class="chip-sep" aria-hidden="true"></i>' + FLAGS.map(function (f) { return chip(f[0], f[1]); }).join('');
  }
  function detailHtml(e, d, forAside) {
    var s = d ? sessionOn(e, d) : e.sessions[0];
    var listing = e.link_type === 'listing';
    var mapQ = encodeURIComponent([e.venue, e.address || e.city].filter(Boolean).join(', '));
    var acts = '<a class="btn primary" href="' + esc(safeUrl(e.url)) + '" target="_blank" rel="noopener">' + (listing ? '在来源页查找 ↗' : '活动页 ↗') + '</a>' +
      '<a class="btn" href="https://www.google.com/maps/search/?api=1&query=' + mapQ + '" target="_blank" rel="noopener">' + PIN + '地图</a>';
    if (s && s.start) {
      var st = s.date.replace(/-/g, '') + 'T' + s.start.replace(':', '') + '00';
      var endT = s.end && s.end > s.start ? s.end : (function () { var h = Math.min(23, parseInt(s.start, 10) + 2); return (h < 10 ? '0' : '') + h + s.start.slice(2); })();
      var en = s.date.replace(/-/g, '') + 'T' + endT.replace(':', '') + '00';
      acts += '<a class="btn" href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(e.title) + '&dates=' + st + '/' + en + '&ctz=' + encodeURIComponent(TZ) + '&location=' + mapQ + '&details=' + encodeURIComponent(safeUrl(e.url)) + '" target="_blank" rel="noopener">' + CAL + '日历</a>';
    }
    var dates = e.sessions.map(function (x) { return longDay(x.date); }).join('、');
    var tags = (e.tags || []).map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('');
    var place = REGION_NAME[e.region] + ' · ' + [e.venue, e.address].filter(Boolean).join(' · ');
    var head = '';
    if (forAside) {
      head = (d && isPick(e, d) ? '<p class="pick">编辑首选</p>' : '') + '<h2>' + esc(e.title) + '</h2>' +
        '<dl class="facts"><div><dt>时间</dt><dd>' + esc(whenText(e, s)) + '</dd></div><div><dt>地点</dt><dd>' + esc(place) + '</dd></div><div><dt>票价</dt><dd>' + esc(e.price) + '</dd></div><div><dt>日期</dt><dd>' + esc(dates) + '</dd></div></dl>';
    }
    return head + '<p class="desc">' + esc(e.desc) + '</p>' + (tags ? '<div class="tags">' + tags + '</div>' : '') +
      '<p class="meta">' + (forAside ? '' : (e.sessions.length > 1 ? '日期：' + esc(dates) + '<br>' : '') + (e.address ? '地址：' + esc(e.address) + '<br>' : '')) + '来源：' + esc(e.source) + (listing ? '（列表页，需按日期查找）' : '') + '</p>' +
      '<div class="actions">' + acts + '</div>';
  }
  function rowHtml(e, d, showDates) {
    var s = d ? sessionOn(e, d) : e.sessions[0];
    var open = state.open === e.id;
    var when = (showDates ? e.sessions.map(function (x) { var p = parts(x.date); return p.m + '/' + p.d; }).join('、') + ' · ' : '') + whenText(e, s) + ' · ' + e.price;
    return '<article class="row" id="' + esc(e.id) + '"><button class="row-btn" type="button" aria-expanded="' + open + '" data-id="' + esc(e.id) + '">' +
      '<span class="row-time">' + esc(s && s.start ? s.start : '—') + '</span><span class="row-main">' +
      (d && isPick(e, d) ? '<span class="pick">编辑首选</span>' : '') +
      '<span class="row-title">' + esc(e.title) + '</span><span class="row-place">' + esc(REGION_NAME[e.region] + ' · ' + e.venue) + '</span><span class="row-when">' + esc(when) + '</span></span>' + CHEV + '</button>' +
      (open ? '<div class="detail">' + detailHtml(e, d, false) + '</div>' : '') + '</article>';
  }
  function startOf(e, d) { var s = d ? sessionOn(e, d) : e.sessions[0]; return s && s.start ? s.start : null; }
  function render() {
    var searching = !!state.q.trim();
    renderTabs(); renderChips();
    var rows, html = '';
    if (searching) {
      rows = data.events.filter(function (e) { return matchQuery(e) && matchFilters(e); });
      rows.sort(function (a, b) { return (a.sessions[0].date + (a.sessions[0].start || '99')).localeCompare(b.sessions[0].date + (b.sessions[0].start || '99')); });
      if (rows.length) html = '<h2 class="group-h">搜索结果<span>' + rows.length + '</span></h2>' + rows.map(function (e) { return rowHtml(e, null, true); }).join('');
    } else {
      rows = data.events.filter(function (e) { return sessionOn(e, state.day) && matchFilters(e); });
      var groups = [['上午', []], ['下午', []], ['晚上', []], ['时间待定', []]];
      rows.forEach(function (e) { var st = startOf(e, state.day); groups[!st ? 3 : st < '12:00' ? 0 : st < '17:00' ? 1 : 2][1].push(e); });
      groups.forEach(function (g) {
        if (!g[1].length) return;
        g[1].sort(function (a, b) { return (startOf(a, state.day) || '99').localeCompare(startOf(b, state.day) || '99'); });
        html += '<h2 class="group-h">' + g[0] + '<span>' + g[1].length + '</span></h2>' + g[1].map(function (e) { return rowHtml(e, state.day, false); }).join('');
      });
    }
    var filtered = Object.keys(state.filters).some(function (k) { return state.filters[k]; });
    if (!rows.length) html = '<div class="empty">没有符合条件的活动。' + (filtered || searching ? '<br><button class="linkbtn" type="button" data-clear>清除筛选和搜索</button>' : '') + '</div>';
    $('list').innerHTML = html;

    var day = days.filter(function (x) { return x.date === state.day; })[0];
    var left = searching ? '在全部 ' + data.events.length + ' 个活动中搜索 “' + esc(state.q.trim()) + '”：<strong>' + rows.length + ' 场</strong>'
      : '<strong>' + longDay(state.day) + '</strong>' + (day && day.title ? ' · ' + esc(day.title) : '') + ' · <strong>' + rows.length + ' 场</strong>';
    $('status').innerHTML = '<span>' + left + '</span>' + (filtered || searching ? '<button class="linkbtn" type="button" data-clear>清除筛选' + (searching ? '和搜索' : '') + '</button>' : '');

    var aside = $('aside'), sel = byId[state.open] && rows.indexOf(byId[state.open]) >= 0 ? byId[state.open] : null;
    if (!sel && rows.length && window.matchMedia('(min-width: 960px)').matches) {
      sel = document.querySelector('.row-btn') ? byId[document.querySelector('.row-btn').getAttribute('data-id')] : rows[0];
      var b = document.querySelector('.row-btn[data-id="' + (window.CSS && CSS.escape ? CSS.escape(sel.id) : sel.id) + '"]'); if (b) b.setAttribute('aria-expanded', 'true');
    }
    aside.innerHTML = sel ? detailHtml(sel, searching ? null : state.day, true) : '';
    aside.style.visibility = sel ? '' : 'hidden';
    writeUrl();
  }

  function init(json) {
    data = json; days = (data.days || []).slice().sort(function (a, b) { return a.date.localeCompare(b.date); });
    data.events.forEach(function (e) { byId[e.id] = e; e.sessions.sort(function (a, b) { return a.date.localeCompare(b.date); }); });
    state.day = defaultDay(); readUrl();
    if (data.headline) $('headline').textContent = data.headline;
    var free = data.events.filter(function (e) { return e.free; }).length, up = (data.updated || '').split('-');
    $('sub').textContent = data.events.length + ' 个活动 · ' + free + ' 场免费' + (up.length === 3 ? ' · ' + Number(up[1]) + ' 月 ' + Number(up[2]) + ' 日更新' : '');
    if (days.length && todayStr() > days[days.length - 1].date) $('sub').textContent += ' · 本期活动已全部结束，等待下次更新';
    $('q').value = state.q;
    if (data.notes && data.notes.length) {
      $('notes').innerHTML = data.notes.map(function (n) { return '<p>' + (n.title ? '<strong>' + esc(n.title) + '</strong> ' : '') + esc(n.body) + '</p>'; }).join('');
      $('notesBox').hidden = false;
    }
    render();
    if (state.open && document.getElementById(state.open)) document.getElementById(state.open).scrollIntoView();
  }

  document.addEventListener('click', function (ev) {
    if (!data) return;
    var t = ev.target.closest('[data-day],[data-f],[data-id],[data-clear]'); if (!t) return;
    if (t.hasAttribute('data-day')) { state.day = t.getAttribute('data-day'); state.q = ''; $('q').value = ''; state.open = null; }
    else if (t.hasAttribute('data-f')) { var k = t.getAttribute('data-f'); state.filters[k] = !state.filters[k]; }
    else if (t.hasAttribute('data-clear')) { state.filters = {}; state.q = ''; $('q').value = ''; }
    else { var id = t.getAttribute('data-id'); state.open = state.open === id && !window.matchMedia('(min-width: 960px)').matches ? null : id; }
    render();
  });
  $('q').addEventListener('input', function (ev) { state.q = ev.target.value; state.open = null; render(); });

  fetch('data.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(init)
    .catch(function () { $('sub').textContent = ''; $('list').innerHTML = '<div class="empty">活动数据加载失败，请刷新重试。</div>'; });
})();
</script>
