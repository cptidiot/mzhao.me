  <div class="prose mb-4 py-2">
    

<article class="thought">
  <div class="t-meta">
    <span class="t-tick"></span>
    <time datetime="2026-10-15T15:52:00-07:00">
      <span class="t-date">Oct 15, 2026</span>
      <span class="t-time">3:52 PM</span>
      <span class="t-loc">San Francisco, CA</span>
    </time>
  </div>
  <div class="t-body"><p>第二条示例：今天捣鼓了一下午网站，成就感比正经上班还足。这条和上面那条都是占位示例，上线时删掉、或换成真正的第一条。</p>
</div>
</article>

<article class="thought">
  <div class="t-meta">
    <span class="t-tick"></span>
    <time datetime="2026-10-15T15:51:00-07:00">
      <span class="t-date">Oct 15, 2026</span>
      <span class="t-time">3:51 PM</span>
      <span class="t-loc">Sunnyvale, CA</span>
    </time>
  </div>
  <div class="t-body"><p>新栏目开张。以后零碎的想法都往这儿放——写长文太累，碎碎念正好。</p>
</div>
</article>


<style>
  article > header h1 { letter-spacing: -.02em; }
  .prose { font-size: 1rem; }
  .thought {
    display: grid;
    grid-template-columns: 132px 1fr;
    column-gap: 28px;
    max-width: 880px;
    padding: 15px 0 17px;
  }
  .t-meta time { display: block; font-variant-numeric: tabular-nums; }
  .t-tick { display: block; width: 26px; height: 3px; background: #1c2733; margin-bottom: 9px; }
  .t-date {
    display: block;
    color: #2f6db3;
    font-weight: 600;
    font-size: .84rem;
    letter-spacing: .07em;
    text-transform: uppercase;
    line-height: 1.35;
  }
  .t-time {
    display: block;
    color: rgba(28,39,51,.52);
    font-size: .8rem;
    letter-spacing: .07em;
    text-transform: uppercase;
    line-height: 1.5;
  }
  .t-loc {
    display: block;
    color: rgba(28,39,51,.52);
    font-size: .8rem;
    line-height: 1.5;
  }
  .t-body { color: #1c2733; font-size: 1.06rem; line-height: 1.6; padding-top: 1px; }
  .t-body p { margin: 0 0 .5rem; }
  .t-body p:last-child { margin-bottom: 0; }
  @media (max-width: 680px) {
    .thought { grid-template-columns: 1fr; row-gap: 5px; padding: 13px 0 15px; }
    .t-tick { display: none; }
    .t-meta time { display: flex; flex-wrap: wrap; gap: 0 .45em; align-items: baseline; }
    .t-date, .t-time, .t-loc { display: inline; }
    .t-time::before, .t-loc::before { content: "· "; }
  }
</style>
