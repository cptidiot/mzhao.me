<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Thoughts</title>
<meta name="description" content="Random thoughts — short notes from Marshall Zhao, now and then.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232e3d4a'/%3E%3Ctext x='32' y='44' font-family='Helvetica, Arial, sans-serif' font-size='36' font-weight='500' fill='%23ffffff' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f8fa;
    --ink: #131a22;
    --body: #3d4a57;
    --muted: #8593a1;
    --accent: #2f6db3;
    --line: rgba(19, 26, 34, .09);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  ::selection { background: rgba(47, 109, 179, .20); }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .head, .thought { animation: rise .8s cubic-bezier(.22, .61, .36, 1) both; }
  .thought { animation-delay: .12s; }
  @media (prefers-reduced-motion: reduce) {
    .head, .thought { animation: none; }
  }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }
  body::before, body::after {
    content: ""; position: fixed; border-radius: 50%;
    filter: blur(110px); pointer-events: none; z-index: 0;
  }
  body::before {
    width: 560px; height: 560px; top: -220px; right: -140px;
    background: radial-gradient(circle, rgba(88, 152, 224, .30), transparent 65%);
  }
  body::after {
    width: 480px; height: 480px; bottom: -240px; left: -160px;
    background: radial-gradient(circle, rgba(150, 120, 230, .22), transparent 65%);
  }
  .wrap {
    position: relative; z-index: 1;
    max-width: 640px; margin: 0 auto;
    padding: 48px 24px 64px;
  }
  .top { margin-bottom: 56px; }
  .top a {
    font-size: 12px; font-weight: 600;
    letter-spacing: .22em; text-transform: uppercase;
    color: var(--accent); text-decoration: none;
  }
  .top a:hover { text-decoration: underline; }
  h1 {
    font-size: clamp(30px, 5.4vw, 40px);
    font-weight: 500;
    letter-spacing: -0.015em;
    line-height: 1.2;
    color: #2e3d4a;
  }
  .sub { margin-top: 10px; font-size: 15px; color: var(--muted); }
  .thought { padding: 26px 0 8px; }
  .thought + .thought { border-top: 1px solid var(--line); margin-top: 18px; }
  .thought time {
    display: block;
    font-size: 12.5px; font-weight: 600;
    letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .thought .text { font-size: 17px; color: var(--body); }
  .thought .text p { margin-bottom: 12px; }
  .thought .text p:last-child { margin-bottom: 0; }
  .thought .text a { color: var(--accent); }
  .empty { padding: 40px 0; font-size: 16px; color: var(--muted); }
  footer {
    margin-top: 72px; padding-top: 22px;
    border-top: 1px solid var(--line);
    color: var(--muted); font-size: 13px;
  }
  @media (max-width: 560px) {
    .wrap { padding: 36px 20px 48px; }
    .thought .text { font-size: 16px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="top"><a href="/">Home</a></div>

    <div class="head">
      <h1>Random Thoughts</h1>
      <p class="sub">Short notes, now and then.</p>
    </div>

    
    
    
    <article class="thought">
      <time datetime="2026-10-15T15:52:00-07:00">Oct 15, 2026 · 3:52 PM · San Francisco, CA</time>
      <div class="text"><p>第二条示例：今天捣鼓了一下午网站，成就感比正经上班还足。这条和上面那条都是占位示例，上线时删掉、或换成真正的第一条。</p>
</div>
    </article>
    
    <article class="thought">
      <time datetime="2026-10-15T15:51:00-07:00">Oct 15, 2026 · 3:51 PM · Sunnyvale, CA</time>
      <div class="text"><p>新栏目开张。以后零碎的想法都往这儿放——写长文太累，碎碎念正好。</p>
</div>
    </article>
    

  </div>

</body>
</html>
